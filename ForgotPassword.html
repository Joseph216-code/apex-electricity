<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>PowerWise - Forgot Password</title>
    <link rel="stylesheet" href="ForgotPassword.css" />
  </head>

  <body>
    <main class="forgot-container">
      <!-- Logo and introduction -->
      <div class="welcome-section">
        <div class="logo">⚡</div>
        <h1>Forgot Your Password?</h1>
        <p>
          Don't worry! Enter your email address and we'll help you reset your
          password.
        </p>
      </div>

      <!-- Email form -->
      <form id="forgot-form">
        <div class="input-group">
          <label for="email">Email Address</label>
          <input
            type="email"
            id="email"
            placeholder="Enter your email address"
            required
          />
        </div>

        <button type="submit">Continue</button>
      </form>

      <!-- Back to login -->
      <p class="back-text">
        Remember your password?
        <a href="Login.html">Log In</a>
      </p>
    </main>

    <!-- Custom Alert Box (matching Login page style) -->
    <div class="alert-overlay" id="alert-overlay">
      <div class="alert-box">
        <div class="alert-icon" id="alert-icon">⚡</div>
        <h2 id="alert-title">Message</h2>
        <p id="alert-message"></p>
        <button id="alert-button">OK</button>
      </div>
    </div>

    <script src="ForgotPassword.js"></script>
  </body>
</html>
