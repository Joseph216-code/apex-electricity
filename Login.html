<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Login</title>
    <link rel="stylesheet" href="Login.css" />
  </head>

  <body>
    <div class="login-container">
      <div class="logo">⚡</div>

      <h1>Apex Electricity</h1>

      <p class="welcome-text"></p>

      <form id="login-form">
        <div class="input-group">
          <label for="email">Email Address</label>
          <input
            type="email"
            id="email"
            placeholder="Enter your email"
            required
          />
        </div>

        <div class="input-group">
          <label for="password">Password</label>

          <div class="password-box">
            <input
              type="password"
              id="password"
              placeholder="Enter your password"
              required
            />

            <button type="button" class="show-password" id="show-password">
              👁️
            </button>
          </div>
        </div>

        <a href="ForgotPassword.html" class="forgot-password"
          >Forgot Password?</a
        >

        <button type="submit" class="login-btn">Log In</button>
      </form>

      <p class="signup-text">
        Don't have an account?
        <a href="NewLogin.html">Create Account</a>
      </p>
    </div>

    <!-- Custom Alert Box -->
    <div class="alert-overlay" id="alert-overlay">
      <div class="alert-box">
        <div class="alert-icon" id="alert-icon">⚡</div>
        <h2 id="alert-title">Message</h2>
        <p id="alert-message"></p>
        <button id="alert-button">OK</button>
      </div>
    </div>

    <script src="Login.js"></script>
  </body>
</html>
